version: "0.5"

processes:
  backend:
    command: python main.py
    working_dir: ./backend
    environment:
      - "VITE_BACKEND_HOST=127.0.0.1"
      - "VITE_BACKEND_PORT=8000"
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 8000
        path: /docs
      initial_delay_seconds: 2
      period_seconds: 5

  frontend:
    command: npm run dev
    working_dir: ./frontend
    environment:
      - "VITE_BACKEND_HOST=127.0.0.1"
      - "VITE_BACKEND_PORT=8000"
